[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-derivative-hedging"
version = "0.1.0"
description = "Reinforcement learning experiments for option hedging under transaction costs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "gymnasium>=0.29",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
rl = ["stable-baselines3>=2.2", "torch>=2.1"]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
